name: Build & Push OpenClaw image (private GHCR)

# Builds the aarch64 add-on image on GitHub-hosted native ARM runners and pushes
# it to a PRIVATE GHCR package. Home Assistant (a HAOS VM on a DGX Spark, 10 GB
# RAM / 8 vCPU; formerly a 4 GB HA Green) pulls this image instead of building
# locally. No user secrets are involved:
# only the ephemeral GITHUB_TOKEN is used to push to this repo's own package.

on:
  push:
    branches: [main]
    paths:
      - "openclaw_assistant/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nosdave/openclaw-assistant-aarch64
  BUILD_FROM: ghcr.io/home-assistant/aarch64-base-debian:bookworm

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64 runner (GA since 2025) — no QEMU
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: |
          V=$(grep -E '^version:' openclaw_assistant/config.yaml | head -1 | sed -E 's/version:\s*"?([^"]+)"?/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $V"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Published version tags are immutable: Home Assistant's rollback ("restore
      # backup") re-pulls the image by its version tag, so rebuilding an existing
      # tag would silently change what a rollback restores. A push that does not
      # bump config.yaml's version therefore builds nothing.
      - name: Refuse to overwrite an existing version tag
        id: tagcheck
        env:
          REF: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
        run: |
          if out="$(docker buildx imagetools inspect "$REF" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$REF is already published; not rebuilding it. Bump 'version' in openclaw_assistant/config.yaml to publish a new image."
          elif grep -qiE 'not found|manifest unknown|name unknown' <<< "$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$REF is new; building."
          else
            echo "::error::Could not determine whether $REF exists:"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Build & push
        if: steps.tagcheck.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: openclaw_assistant
          file: openclaw_assistant/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            BUILD_FROM=${{ env.BUILD_FROM }}
            TARGETARCH=arm64
            BUILD_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
